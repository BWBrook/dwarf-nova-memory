name: Seed scientific invariants
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --frozen --extra analysis --python "${{ matrix.python-version }}"
      - run: uv run --frozen --extra analysis python -m unittest discover -s tests -v
      - run: uv run --frozen --extra analysis python scripts/validate_seed.py
      - run: uv run --frozen --extra analysis python scripts/check_demo_reproduction.py
