[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwarf-nova-memory"
version = "0.1.0"
description = "Research seed for observation-aware evaluation of dwarf-nova recurrence forecasts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]
analysis = ["numpy>=2,<3", "scipy>=1.15,<2"]

[project.scripts]
dnmem = "dnmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
